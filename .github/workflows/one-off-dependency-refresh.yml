# Temporary one-shot feature-branch task; delete after reviewing the lockfile refresh.
name: OpenXdrive dependency advisory refresh
on:
  push:
    branches: [fix/ant-v6-postmerge-qa-security]
    paths:
      - .github/workflows/one-off-dependency-refresh.yml
permissions:
  contents: write
jobs:
  refresh-and-validate:
    if: github.repository == 'Satzzxzxx-OSS/OpenXdrive'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ant-v6-postmerge-qa-security
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update compatible backend locked dependencies
        working-directory: backend
        shell: bash
        run: |
          npm ci
          npm audit fix --omit=dev --audit-level=high || true
          npm ci
          npx prisma generate
          npm run build
          npm audit --omit=dev --audit-level=high || true
      - name: Update compatible frontend locked dependencies
        working-directory: frontend
        shell: bash
        run: |
          npm ci
          npm audit fix --omit=dev --audit-level=high || true
          npm ci
          npm run build
          npm audit --omit=dev --audit-level=high || true
      - name: Commit audited dependency lockfile changes only to feature branch
        shell: bash
        env:
          TARGET_BRANCH: fix/ant-v6-postmerge-qa-security
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/package.json backend/package-lock.json frontend/package.json frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(deps): refresh compatible audited production dependencies'
            git push origin HEAD:"$TARGET_BRANCH"
          else
            echo 'No compatible lockfile updates available'
          fi
